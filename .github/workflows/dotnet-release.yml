name: Build and Create Release

on:
  push:
    branches:
      - 'v*/release'
      
permissions:
  contents: read
  pull-requests: read
  
jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # ✅ Lấy tên branch
      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      # ✅ Tách prefix (v16 từ v16/release)
      - name: Extract version prefix
        id: version_prefix
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"
          PREFIX=$(echo "$BRANCH" | cut -d'/' -f1)
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build & Publish .NET project
        run: |
          mkdir -p publish_output
          dotnet publish ./uTPro/Project/uTPro.Project.Web/uTPro.Project.Web.csproj -c Release -o publish_output

      - name: Archive publish output
        run: |
          zip -r publish_output.zip publish_output

      # ✅ Đổi tên file theo prefix (publish_output_v16.zip)
      - name: Rename output file
        id: rename
        run: |
          NEW_NAME="publish_output_${{ steps.version_prefix.outputs.prefix }}.zip"
          mv publish_output.zip "$NEW_NAME"
          echo "file_name=$NEW_NAME" >> $GITHUB_OUTPUT

      # ✅ Lấy version từ <Version> trong uTPro.Project.Web.csproj
      - name: Set version tag
        id: version
        run: |
          CSPROJ="./uTPro/Project/uTPro.Project.Web/uTPro.Project.Web.csproj"
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' "$CSPROJ" | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find <Version> in $CSPROJ"
            exit 1
          fi
          echo "Found version: $VERSION"
          echo "version_tag=v$VERSION" >> $GITHUB_OUTPUT

      # ✅ Kiểm tra tag đã tồn tại chưa, nếu rồi thì thêm suffix để không ghi đè release cũ
      - name: Resolve unique tag
        id: resolve_tag
        run: |
          TAG="${{ steps.version.outputs.version_tag }}"
          # Kiểm tra tag đã tồn tại trên remote chưa
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            # Tag đã tồn tại — thêm timestamp suffix
            SUFFIX=$(date +%Y%m%d%H%M%S)
            UNIQUE_TAG="${TAG}-build.${SUFFIX}"
            echo "Tag '$TAG' already exists. Using unique tag: $UNIQUE_TAG"
            echo "release_tag=$UNIQUE_TAG" >> $GITHUB_OUTPUT
            echo "tag_existed=true" >> $GITHUB_OUTPUT
          else
            echo "Tag '$TAG' is new."
            echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            echo "tag_existed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_tag.outputs.release_tag }}
          name: Release ${{ steps.version.outputs.version_tag }}
          body: |
            Auto-generated release from branch `${{ steps.branch.outputs.branch_name }}`
            - Version: `${{ steps.version.outputs.version_tag }}`
            - Tag: `${{ steps.resolve_tag.outputs.release_tag }}`
            - Tag existed: ${{ steps.resolve_tag.outputs.tag_existed }}
            - Build time: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
          draft: true
          prerelease: true
          files: ${{ steps.rename.outputs.file_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
