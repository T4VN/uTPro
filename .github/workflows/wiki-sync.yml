name: Sync Wiki to Pages

permissions:
  contents: write
  pull-requests: write
      
on:
  push:
    branches:
      - 'gh-pages'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          clean: false
          path: .
          
      - name: Clone wiki repo
        run: git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-source
        
      - name: Kiểm tra wiki-source có file không 
        run: ls -la wiki-source
        
      - name: Copy git wiki to folder docs
        run: |
          rsync -av --delete --exclude='.git' wiki-source/ docs/
          rm -rf wiki-source

      - name: Add Jekyll front matter to docs
        run: |
          declare -A DESCRIPTIONS
          DESCRIPTIONS["Home"]="Developer documentation for uTPro – an Umbraco Starter Kit by T4VN. Setup guides, architecture, configurations, and developer reference."
          DESCRIPTIONS["1.-Intro"]="Introduction to uTPro – features, architecture overview, tech stack, and core principles of the Umbraco Starter Kit."
          DESCRIPTIONS["2.-Setup"]="Step-by-step setup guide for uTPro: domain configuration, database setup, uSync data import, and first run."
          DESCRIPTIONS["3.-Project-Structure"]="uTPro solution architecture: modular .NET projects, middleware pipeline, and Program.cs configuration."
          DESCRIPTIONS["4.-Configurations"]="Complete configuration reference for uTPro: language, security, performance, SEO, database, load balancing, and feature packages."
          DESCRIPTIONS["5.-Script-Queue"]="uTPro Script Queue system: load JS/CSS only when a block component renders. Dependency-aware, deferred, and optimized."
          DESCRIPTIONS["6.-Dashboard"]="uTPro backoffice dashboard: version check, site statistics, audit trail chart, and quick management links."
          DESCRIPTIONS["7.-Content-Editing"]="Content editing guide for uTPro: pages, Block Grid components, SEO fields, multilingual content, and media."
          DESCRIPTIONS["8.-Global-Settings"]="CMS-driven global settings in uTPro: favicon, robots.txt, image optimization, forms, and security headers."
          DESCRIPTIONS["9.-Developer-Reference"]="Developer reference for uTPro: Razor helpers, C# extension methods, tag helpers, and utility classes."
          DESCRIPTIONS["10.-Backoffice-Tools"]="Backoffice tools in uTPro: Block Preview, error pages, SEO Audit, File Manager, Job Monitor, Form Builder."

          for file in docs/*.md; do
            # Skip if already has front matter
            if head -1 "$file" | grep -q "^---"; then
              continue
            fi
            # Extract basename without extension
            basename_noext=$(basename "$file" .md)
            # Extract title from filename: "1.-Intro.md" -> "Intro"
            title=$(echo "$basename_noext" | sed 's/^[0-9]*\.-//' | sed 's/-/ /g' | sed 's/\./ /g')
            # Get description or use default
            desc="${DESCRIPTIONS[$basename_noext]:-"uTPro documentation – $title. Developer guide for the Umbraco Starter Kit by T4VN."}"
            # Prepend front matter
            tmpfile=$(mktemp)
            printf '%s\n' "---" "layout: default" "title: \"$title\"" "description: \"$desc\"" "---" "" | cat - "$file" > "$tmpfile"
            mv "$tmpfile" "$file"
          done
          
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          
      - name: Generate datetime branch name 
        run: echo "BRANCH_NAME=gh-pages-wiki-sync-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create new branch and commit
        id: commit
        run: | 
          git checkout -b $BRANCH_NAME 
          git add docs
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            git commit -m "Sync wiki at $(date)"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
                
      - name: Push changes to ${{ env.BRANCH_NAME }} branch
        if: steps.commit.outputs.has_changes == 'true'
        run: git push origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        run: |
            gh pr create \
            --title "Sync wiki - $BRANCH_NAME" \
            --body "Auto-sync wiki to GitHub Pages" \
            --base gh-pages \
            --head $BRANCH_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
