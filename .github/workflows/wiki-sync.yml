name: Sync Wiki to Pages

permissions:
  contents: write
  pull-requests: write
      
on:
  push:
    branches:
      - 'gh-pages'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0
          clean: false
          path: .
          
      - name: Clone wiki repo
        run: git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-source
        
      - name: Kiểm tra wiki-source có file không 
        run: ls -la wiki-source
        
      - name: Copy git wiki to folder docs
        run: |
          rsync -av --delete --exclude='.git' wiki-source/ docs/
          rm -rf wiki-source
          
      - name: Add Jekyll front matter to docs
        run: |
          for file in docs/*.md; do
            # Skip if already has front matter
            if head -1 "$file" | grep -q "^---"; then
              continue
            fi
            # Extract title from filename: "1.-Intro.md" -> "Introduction"
            basename=$(basename "$file" .md)
            title=$(echo "$basename" | sed 's/^[0-9]*\.-//' | sed 's/-/ /g' | sed 's/\./ /g')
            # Prepend front matter
            tmpfile=$(mktemp)
            echo "---" > "$tmpfile"
            echo "layout: default" >> "$tmpfile"
            echo "title: \"$title\"" >> "$tmpfile"
            echo "---" >> "$tmpfile"
            echo "" >> "$tmpfile"
            cat "$file" >> "$tmpfile"
            mv "$tmpfile" "$file"
          done
          
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          
      - name: Generate datetime branch name 
        run: echo "BRANCH_NAME=gh-pages-wiki-sync-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create new branch and commit
        run: | 
          git checkout -b $BRANCH_NAME 
          git add docs
          git commit -m "Sync wiki at $(date)" || echo "No changes"
                
      - name: Push changes to ${{ env.BRANCH_NAME }} branch
        run: git push origin $BRANCH_NAME

      - name: Create Pull Request
        run: |
            gh pr create \
            --title "Sync wiki - $BRANCH_NAME" \
            --body "Auto-sync wiki to GitHub Pages" \
            --base gh-pages \
            --head $BRANCH_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
