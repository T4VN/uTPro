title: uTPro Documentation
description: Developer documentation for uTPro – Umbraco Turbo Pro Starter Kit
url: "https://docs.utpro.dev"
baseurl: ""

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# Defaults
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: "default"

# Collections
include:
  - docs

# SEO
author: T4VN
logo: /Logo.png
social:
  name: T4VN
  links:
    - https://github.com/T4VN
    - https://t4vn.com
