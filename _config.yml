title: uTPro Documentation
description: Developer documentation for uTPro – Umbraco Turbo Pro Starter Kit
url: "https://docs.utpro.dev"
baseurl: ""

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: none
  hard_wrap: false

# Sass
sass:
  style: compressed

# Compress HTML. NOTE: this collapses whitespace inside inline <script> too,
# so inline scripts must NOT use // line comments (use /* */ block comments)
# or the whole line gets commented out after minification.
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  startings: []
  blanklines: false
  profile: false

# Defaults - apply layout to all md files
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "docs"
    values:
      layout: "default"
  - scope:
      path: "features"
    values:
      layout: "default"
      feature: true

# SEO
author: T4VN
logo: /logo.svg
social:
  name: T4VN
  links:
    - https://github.com/T4VN
    - https://t4vn.com
